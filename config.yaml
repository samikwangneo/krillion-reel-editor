raw_root: raw
out_root: out
work_root: work
files:
  p1_screen: p1_screen.*
  p2_screen: p2_screen.*
  p1_cam: p1_cam.*
  p2_cam: p2_cam.*
cam_audio_track:
  p1: null
  p2: null
questions: 7
drop_questions: []
groups: []          # 3+ players: sides, e.g. [[p1, p2]]; usually set per session in sync.json "groups"
tiers:
- nothing landed   # ran out of time / answer didn't score
- plankton
- schooler
- rare
- deep cut
- one in a krillion
timeline:
  lead: 3.5
  include_results: true
  ending_hold: 2.0
  intro: p1          # open on this team's intro (their cam before the first prompt); null = no intro
cut:
  min_gap: 1.5
  padding: 0.4
  protect_before: 0.5
  protect_after: 2.0
  protect_thinking: true
  static_motion: 0.004
  speech_db_above_floor: 12
speed:                    # everything plays at `boring` speed, except...
  enabled: true
  boring: 1.25
  normal_tiers: [deep cut, one in a krillion]   # ...these reveals + the reaction, at 1x
  around_reveal: [0.3, 3.0]   # 1x from 0.3s before the card to 3s after
  reaction_max: 6.0           # and on while they're still loud, up to 6s after the card
  reaction_percentile: 93     # "loud" = this team's loudest 7%
  reaction_pad: [0.5, 1.5]
  slow_submit: false          # true: also 1x around the answer being submitted (around_submit)
  around_submit: [1.5, 0.5]
  slow_reactions: false       # true: also 1x for every loud reaction
  slow_results: false         # true: final score at 1x
  min_fast: 2.0               # 1.25x stretches shorter than this stay 1x
  filler_max: 1.55            # filler (model picks + answer sinking) may go up to this to hit target_seconds
  sink_pad: 0.4               # "answer sinking" = submit + this .. card - this
layout:
  answering: model        # model = Claude picks the clips from out/<session>/brief.md into picks.json
                          #   (checked against the highlights rules; no picks -> the highlights cut)
                          # highlights = shorter cut: one team reading, 5s of each team thinking,
                          #   the liveliest 4s of each team's middle, both teams' last 10s
                          # interleave = cut between teams after someone finishes a line; each team
                          #   resumes where it was left, so no thinking is lost
                          # sequential = one team's full thinking, then the other's
                          # alternate  = shared clock, cuts between teams (loses ~half of each think)
  highlights:
    think_after_read: 3.0      # first seconds of thinking after the prompt is read (reading team)
    think_after_read_other: 0.0  # same for the other team (0 = only if picked)
    middle: 4.0                # liveliest bit of each team's discussion in between
    end_before_submit: 5.0     # always keep each team's last seconds before submitting (user: 5-10s)
    no_cut_before_submit: 3.0  # final shot runs uncut from here through the card + reaction
    read_max: 8.0              # look this long for them reading the prompt aloud
    read_fallback: 1.5         # nobody read it aloud: show the prompt until clock start + this
  pause_search: 4.0       # interleave: how long to wait for the end of a line before cutting anyway
  reveal_before: 1.0
  reveal_after: 2.5
  big_reveal_after: 4.0   # deep cut / krillion reveals stay on at least this long (+ while still loud)
  min_shot: 3.0
  max_shot: 8.0
  min_cam_height: 620
  bottom_safe: 150   # px kept clear at the bottom (Instagram caption overlay)
  flash: [0.3, 1.7]  # 3+ players: quick look at a non-featured team's card (s before, s after)
zoom:
  enabled: true
  strength: 1.0
  ease: 0.2
  hold: 0.6
  ease_out: 0.4
  idle_after: 4.0
  idle_strength: 1.04
  tiers:
    nothing landed: 1.06
    plankton: 1.08
    schooler: 1.1
    rare: 1.15
    deep cut: 1.2
    one in a krillion: 1.3
whisper:
  model: small.en
  device: cpu
  compute_type: int8
  language: en
audio:
  lufs: -14
  game_audio_db: -12
output:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 179     # IG only pushes reels <= 2:59 to new viewers
  target_seconds: 179  # filler speed (<= speed.filler_max) is fitted to land exactly here
  preset: veryfast
  crf: 20
  workers: 1        # >1 renders chunks in parallel - only helps if decoding is not already using every core
